*{box-sizing:border-box} :root{--bg:#f5efe3;--ink:#30273a;--accent:#70445f;--paper:#fffaf2;--shelf:#563b31}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:white}button.secondary{background:var(--paper);color:var(--ink);border:1px solid #b9a9a1}header{padding:20px 5%;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:10px}h1,h2,h3{font-family:Georgia,serif;margin:0 0 12px}h1{font-size:28px}main{max-width:1050px;margin:auto;padding:22px 16px 100px}.panel{background:var(--paper);border:1px solid #bdaea344;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 20px #00000009}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--paper);border-top:1px solid #bdaea3;z-index:10}nav button{background:none;color:var(--ink);flex:1;max-width:180px;border-radius:0;font-size:13px;padding:15px 3px}nav button.active{color:var(--accent);font-weight:bold;border-top:3px solid var(--accent)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}.card{background:var(--paper);border-radius:12px;padding:10px;cursor:pointer}.cover{height:180px;width:100%;object-fit:contain;background:#d7c9b8;border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;color:#46374c;font-family:Georgia;padding:5px}.card img.cover{padding:0}.muted{opacity:.7;font-size:13px}label{display:block;margin:9px 0 4px;font-size:13px;font-weight:600}input,select,textarea{width:100%;border:1px solid #b7a6a0;border-radius:9px;padding:10px;background:var(--paper);color:var(--ink)}textarea{min-height:80px}dialog{border:0;border-radius:20px;background:var(--paper);color:var(--ink);width:min(95vw,780px);max-height:92vh;overflow:auto;padding:20p </style></head><body><header><div><small>✦ TU UNIVERSO LECTOR</small><h1>Arcane Reads</h1></div><button onclick="editBook()">+ Libro</button></header><main id="main"></main><nav id="nav"></nav><dialog id="dlg"></dialog><input type="file" id="importer" accept=".csv,.json" hidden><script>
let data={books:[],shelves:[{id:'s1',name:'Arcane Reads',theme:'celestial',background:'',rows:3}],theme:'celestial',goal:20,sessions:[]},tab='Inicio',shelfId='s1',db,angle=-25,draft=null,dragId=null;const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('en-CA');
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('ArcaneReads',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>{db=r.result;res()};r.onerror=rej})}function load(){return new Promise(r=>{let q=db.transaction('state').objectStore('state').get('data');q.onsuccess=()=>{if(q.result)data=q.result;r()};q.onerror=()=>r()})}function save(){return new Promise((r,j)=>{let t=db.transaction('state','readwrite');t.objectStore('state').put(data,'data');t.oncomplete=r;t.onerror=()=>{alert('No se pudo guardar. Exporta una copia de seguridad.');j(t.error)}})}function update(){save().catch(console.error);render()}function book(id){return data.books.find(b=>b.id===id)}function shelf(){return data.shelves.find(s=>s.id===shelfId)||data.shelves[0]}function setTab(t){tab=t;render()}function img(src,cl=''){return src?`<img class="${cl}" src="${esc(src)}" alt="">`:''}function cover(b){return b.cover?img(b.cover,'cover'):`<div class="cover">✦<br>${esc(b.title)}</div>`}function cards(bs){return `<div class="grid">${bs.map(b=>`<div class="card" onclick="editBook('${b.id}')">${cover(b)}<strong>${esc(b.title)}</strong><div class="muted">${esc(b.author)} · ${esc(b.status)}</div></div>`).join('')}</div>`}function render(){document.body.className='theme-'+data.theme;$('nav').innerHTML=['Inicio','Libros','Biblioteca','Estadísticas','Perfil'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${['⌂','▤','▥','▥','⚙'][i]}<br>${t}</button>`).join('');let m=$('main'),reading=data.books.filter(b=>b.status==='Leyendo'),done=data.books.filter(b=>b.status==='Leído');if(tab==='Inicio')m.innerHTML=`<h2>Tu próximo capítulo</h2><div class="panel"><h3>${reading.length?'Continúa tu lectura':'¿Qué estás leyendo?'}</h3>${reading.length?cards(reading):'<p>Elige un libro y comienza tu historia.</p>'}<button onclick="setTab('Libros')">Elegir libro</button> <button class="secondary" onclick="roulette()">✦ Ruleta</button></div><div class="panel"><h3>Tu biblioteca</h3><p>${data.books.length} libros · ${data.shelves.length} biblioteca(s)</p><button onclick="setTab('Biblioteca')">Entrar en mi biblioteca</button></div><div class="panel"><h3>Tu meta anual</h3><div class="stat">${done.length} / ${data.goal}</div><progress value="${done.length}" max="${data.goal}" style="width:100%"></progress></div>`;else if(tab==='Libros')m.innerHTML=`<h2>Mis libros</h2><div class="row"><input id="search" placeholder="Buscar título, autor, saga..." oninput="filterBooks()" style="flex:2"><select id="filter" onchange="filterBooks()" style="flex:1"><option>Todos</option>${['Por leer','Leyendo','Leído','Abandonado'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="results" style="margin-top:15px">${cards(data.books)||''}</div>${data.books.length?'':'<div class="panel">Tu biblioteca está vacía. Añade un libro o importa Goodreads.</div>'}`;else if(tab==='Biblioteca'){let s=shelf();m.innerHTML=`<div class="row"><h2 style="flex:1">${esc(s.name)}</h2><button class="secondary" onclick="shelfSettings()">⚙ Personalizar</button><button onclick="newShelf()">+ Biblioteca</button></div><select onchange="shelfId=this.value;render()">${data.shelves.map(x=>`<option value="${x.id}" ${s.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="shelfarea" style="margin-top:14px;${s.background?`background-image:url('${s.background}')`:s.theme==='cozy'?'background:linear-gradient(#c8a78b,#815a42)':s.theme==='dark'?'background:linear-gradient(#30252a,#140e18)':''}">${Array.from({length:s.rows},(_,i)=>`<div class="shelfrow" ondragover="event.preventDefault()" ondrop="dropBook(event,${i})">${data.books.filter(b=>b.shelf===s.id&&Number(b.row||0)===i).map(b=>{let front=b.display==='Portada',edge=b.display==='Canto',src=front?b.cover:edge?b.edge:b.spine,w=front?b.width:b.thick;return `<button draggable="true" ondragstart="dragId='${b.id}'" onclick="editBook('${b.id}')" class="sbook ${front?'front':''}" style="height:${Math.min(202,(b.height||22)*7)}px;width:${Math.max(16,(w||3)*7)}px;background:${esc(edge?b.edgeColor||'#ded0bc':b.color||'#765782')}">${src?img(src):`<span>${esc(b.title)}</span>`}</button>`}).join('')}</div>`).join('')}</div><p class="muted">Pulsa un libro para editarlo. En computadora, arrástralo a otra repisa. En móvil, cambia su repisa desde el editor.</p>`}else if(tab==='Estadísticas'){let pages=data.sessions.reduce((a,x)=>a+x.pages,0),mins=data.sessions.reduce((a,x)=>a+x.minutes,0);m.innerHTML=`<h2>Tu historia lectora</h2><div class="grid">${[[pages,'Páginas registradas'],[mins,'Minutos'],[done.length,'Libros terminados']].map(([v,l])=>`<div class="panel"><div class="stat">${v}</div>${l}</div>`).join('')}</div><div class="panel"><h3>Sesiones de lectura</h3>${data.sessions.slice().reverse().map(s=>`<p>${esc(s.date)} · ${esc(book(s.bookId)?.title||'Libro eliminado')} · ${s.pages} pág. · ${s.minutes} min</p>`).join('')||'Todavía no hay sesiones.'}<button onclick="sessionDialog()">+ Registrar sesión</button></div>`}else m.innerHTML=`<h2>Mi perfil</h2><div class="panel"><h3>Estética</h3><select onchange="data.theme=this.value;update()">${['celestial','dark','cozy','classic'].map((x,i)=>`<option value="${x}" ${data.theme===x?'selected':''}>${['Celestial','Dark academia','Cozy','Clásico'][i]}</option>`).join('')}</select><label>Meta anual de libros</label><input type="number" min="1" value="${data.goal}" onchange="data.goal=Math.max(1,+this.value);update()"></div><div class="panel"><h3>Mis datos</h3><p>Importa Goodreads o restaura una copia de Arcane Reads.</p><div class="row"><button onclick="$('importer').click()">Importar CSV / JSON</button><button class="secondary" onclick="backup()">Exportar copia</button></div><p class="notice">Los datos se guardan en este navegador. La sincronización en la nube aún no está configurada. Exporta una copia para mover tu biblioteca a otro dispositivo.</p></div>`}
function filterBooks(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('results').innerHTML=cards(data.books.filter(b=>(f==='Todos'||b.status===f)&&[b.title,b.author,b.saga,b.collection].join(' ').toLowerCase().includes(q)))}function roulette(){let a=data.books.filter(b=>b.status==='Por leer');if(!a.length)return alert('No hay libros pendientes.');editBook(a[Math.floor(Math.random()*a.length)].id)}function dropBook(e,i){e.preventDefault();let b=book(dragId);if(b){b.row=i;update()}}function newShelf(){let name=prompt('Nombre de la biblioteca');if(!name?.trim())return;let s={id:uid(),name:name.trim(),theme:'celestial',rows:3,background:''};data.shelves.push(s);shelfId=s.id;update()}function readImage(file){return new Promise((res,rej)=>{if(!file)return res('');let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*scale);c.height=Math.max(1,im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}function show(html){$('dlg').innerHTML=html;if(!$('dlg').open)$('dlg').showModal()}function closeDlg(){$('dlg').close()}function shelfSettings(){let s=shelf();show(`<button class="close secondary" onclick="closeDlg()">✕</button><h2>Personalizar biblioteca</h2><label>Nombre</label><input id="sn" value="${esc(s.name)}"><label>Estilo</label><select id="st"><option value="celestial">Celestial</option><option value="dark">Dark academia</option><option value="cozy">Cozy</option></select><label>Número de repisas</label><input id="sr" type="number" min="1" max="100" value="${s.rows}"><label>Fondo propio</label><input type="file" accept="image/*" onchange="readImage(this.files[0]).then(x=>{s.background=x;save()})"><p><button onclick="s.name=$('sn').value||s.name;s.theme=$('st').value;s.rows=Math.max(1,Math.min(100,+$('sr').value));data.books.filter(b=>b.shelf===s.id&&b.row>=s.rows).forEach(b=>b.row=s.rows-1);closeDlg();update()">Guardar</button></p>`);$('st').value=s.theme;window.s=s}
function editBook(id){draft=structuredClone(book(id)||{id:uid(),title:'',author:'',pages:0,current:0,status:'Por leer',height:22,width:14,thick:3,color:'#765782',edgeColor:'#e3d4b8',display:'Lomo',shelf:shelf().id,row:0,format:'Tapa blanda',rating:0,notes:'',saga:'',collection:''});angle=-25;show(`<button class="close secondary" onclick="closeDlg()">✕</button><h2>${id?'Editar libro':'Añadir libro'}</h2><div class="editor"><div><div class="preview" id="preview"><div class="cube" id="cube"></div></div><div class="row tabs">${[['Portada',0],['Lomo',90],['Canto',-90],['Contraportada',180],['Superior',-35],['Inferior',35]].map(([n,a])=>`<button class="secondary" onclick="angle=${a};drawCube('${n}')">${n}</button>`).join('')}</div><p class="muted">Arrastra para girar. Sube fotos recortadas de cada cara.</p>${[['cover','Portada'],['spine','Lomo'],['edge','Canto delantero'],['back','Contraportada'],['top','Canto superior'],['bottom','Canto inferior']].map(([k,n])=>`<label>${n}</label><input class="file" type="file" accept="image/*" onchange="readImage(this.files[0]).then(x=>{draft.${k}=x;drawCube()})">`).join('')}</div><div>${[['title','Título'],['author','Autor'],['isbn','ISBN'],['saga','Saga'],['collection','Colección']].map(([k,n])=>`<label>${n}</label><input value="${esc(draft[k])}" oninput="draft.${k}=this.value;drawCube()">`).join('')}<div class="row">${[['height','Altura (cm)'],['width','Ancho (cm)'],['thick','Grosor (cm)'],['pages','Páginas'],['current','Página actual']].map(([k,n])=>`<div style="flex:1;min-width:90px"><label>${n}</label><input type="number" min="0" step="${k==='pages'||k==='current'?1:.1}" value="${draft[k]||0}" oninput="draft.${k}=+this.value;drawCube()"></div>`).join('')}</div>${[['status','Estado',['Por leer','Leyendo','Leído','Abandonado']],['format','Encuadernación',['Tapa blanda','Tapa dura','Digital','Audiolibro']],['display','Mostrar en repisa',['Lomo','Portada','Canto']]].map(([k,n,opts])=>`<label>${n}</label><select onchange="draft.${k}=this.value">${opts.map(o=>`<option ${draft[k]===o?'selected':''}>${o}</option>`).join('')}</select>`).join('')}<label>Biblioteca</label><select onchange="draft.shelf=this.value">${data.shelves.map(s=>`<option value="${s.id}" ${draft.shelf===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Repisa (1 = superior)</label><input type="number" min="1" value="${(draft.row||0)+1}" onchange="draft.row=Math.max(0,+this.value-1)"><div class="row"><div style="flex:1"><label>Color lomo</label><input type="color" value="${draft.color||'#765782'}" oninput="draft.color=this.value;drawCube()"></div><div style="flex:1"><label>Color canto</label><input type="color" value="${draft.edgeColor||'#e3d4b8'}" oninput="draft.edgeColor=this.value;drawCube()"></div></div><label>Valoración (0–5)</label><input type="number" min="0" max="5" step=".5" value="${draft.rating||0}" onchange="draft.rating=+this.value"><label>Notas / citas / reseña</label><textarea oninput="draft.notes=this.value">${esc(draft.notes)}</textarea><p><button onclick="saveBook()">Guardar libro</button> ${id?`<button class="secondary" onclick="deleteBook('${id}')">Eliminar</button>`:''}</p></div></div>`);drawCube();let p=$('preview'),x=0,drag=false;p.onpointerdown=e=>{drag=true;x=e.clientX;p.setPointerCapture(e.pointerId)};p.onpointermove=e=>{if(drag){angle+=(e.clientX-x)*.8;x=e.clientX;drawCube()}};p.onpointerup=()=>drag=false;p.onpointercancel=()=>drag=false}
function drawCube(view){let c=$('cube');if(!c)return;let h=Math.min(220,Math.max(70,(draft.height||22)*9)),w=h*Math.max(.25,Math.min(1.4,(draft.width||14)/(draft.height||22))),d=Math.max(8,Math.min(100,h*(draft.thick||3)/(draft.height||22)));c.style.width=w+'px';c.style.height=h+'px';c.style.transform=`rotateX(${view==='Superior'? -75:view==='Inferior'?75:5}deg) rotateY(${angle}deg)`;let face=(key,cl,style,txt,bg)=>`<div class="face ${cl}" style="${style};background-color:${bg||'#715378'}">${draft[key]?img(draft[key]):`<span>${esc(txt)}</span>`}</div>`;c.innerHTML=face('cover','',`width:${w}px;height:${h}px;transform:translateZ(${d/2}px)`,draft.title||'✦ Arcane Reads',draft.color)+face('back','',`width:${w}px;height:${h}px;transform:rotateY(180deg) translateZ(${d/2}px)`,draft.author,draft.color)+face('spine','spine',`width:${d}px;height:${h}px;left:${(w-d)/2}px;transform:rotateY(-90deg) translateZ(${w/2}px)`,draft.title,draft.color)+face('edge','',`width:${d}px;height:${h}px;left:${(w-d)/2}px;transform:rotateY(90deg) translateZ(${w/2}px)`,``,draft.edgeColor)+face('top','',`width:${w}px;height:${d}px;top:${(h-d)/2}px;transform:rotateX(90deg) translateZ(${h/2}px)`,``,draft.edgeColor)+face('bottom','',`width:${w}px;height:${d}px;top:${(h-d)/2}px;transform:rotateX(-90deg) translateZ(${h/2}px)`,``,draft.edgeColor)}function saveBook(){if(!draft.title.trim())return alert('Escribe un título.');if([draft.height,draft.width,draft.thick].some(v=>!Number.isFinite(v)||v<=0))return alert('Las dimensiones deben ser positivas.');let s=data.shelves.find(s=>s.id===draft.shelf)||shelf();draft.shelf=s.id;draft.row=Math.min(s.rows-1,Math.max(0,draft.row||0));draft.pages=Math.max(0,Math.floor(draft.pages||0));draft.current=Math.min(draft.pages,Math.max(0,Math.floor(draft.current||0)));let i=data.books.findIndex(b=>b.id===draft.id);if(i<0)data.books.push(draft);else data.books[i]=draft;closeDlg();update()}function deleteBook(id){if(confirm('¿Eliminar este ejemplar?')){data.books=data.books.filter(b=>b.id!==id);closeDlg();update()}}
function sessionDialog(){if(!data.books.length)return alert('Añade un libro primero.');show(`<button class="close secondary" onclick="closeDlg()">✕</button><h2>Registrar lectura</h2><label>Libro</label><select id="sb">${data.books.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select><label>Fecha</label><input type="date" id="sd" value="${new Date().toISOString().slice(0,10)}"><label>Páginas leídas</label><input id="sp" type="number" min="0" value="0"><label>Minutos</label><input id="sm" type="number" min="0" value="0"><p><button onclick="let p=Math.max(0,+$('sp').value),m=Math.max(0,+$('sm').value),b=book($('sb').value);data.sessions.push({bookId:b.id,date:$('sd').value,pages:p,minutes:m});b.current=Math.min(b.pages||Infinity,(b.current||0)+p);b.status=b.pages&&b.current>=b.pages?'Leído':'Leyendo';closeDlg();update()">Guardar sesión</button></p>`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='arcane-reads-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function parseCSV(t){let rows=[],r=[],s='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){r.push(s);s=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(s);rows.push(r);r=[];s=''}else s+=c}if(s||r.length){r.push(s);rows.push(r)}return rows} $('importer').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let t=await f.text();if(f.name.endsWith('.json')){let d=JSON.parse(t);if(!Array.isArray(d.books)||!Array.isArray(d.shelves)||!d.shelves.length||!Array.isArray(d.sessions))throw Error('Copia inválida');if(confirm('¿Reemplazar tus datos con esta copia?')){data=d;shelfId=d.shelves[0].id;update()}}else{let [head,...rows]=parseCSV(t.replace(/^\uFEFF/,''));let ix=k=>head.indexOf(k),val=(r,k)=>r[ix(k)]||'';if(ix('Title')<0)throw Error('No se encontró la columna Title de Goodreads');let n=0;for(let r of rows){let title=val(r,'Title'),author=val(r,'Author'),gid=val(r,'Book Id');if(!title||data.books.some(b=>gid?b.goodreadsId===gid:b.title===title&&b.author===author))continue;let isbn=(val(r,'ISBN13')||val(r,'ISBN')).replace(/[^0-9X]/gi,'');data.books.push({id:uid(),goodreadsId:gid,title,author,isbn,pages:+val(r,'Number of Pages')||0,status:({'read':'Leído','currently-reading':'Leyendo','to-read':'Por leer'})[val(r,'Exclusive Shelf')]||'Por leer',rating:+val(r,'My Rating')||0,notes:val(r,'My Review'),collection:val(r,'Bookshelves'),height:22,width:14,thick:3,color:'#765782',edgeColor:'#e3d4b8',display:'Lomo',shelf:shelf().id,row:0});n++}update();alert('Importados: '+n+' libros. Puedes añadir sus fotos y medidas en el editor.')}}catch(err){alert('No se pudo importar: '+err.message)}e.target.value=''};openDB().then(load).then(render).catch(()=>alert('No se pudo abrir el almacenamiento local. Prueba en un navegador moderno.'));
