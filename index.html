<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3eee5">
  <title>Arcane Reads</title>
  <link rel="manifest" href="site.webmanifest?v=6.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f3eee5;
      --panel:#fbf7f0;
      --card:#fffaf3;
      --ink:#30221f;
      --muted:#8a766d;
      --line:#e5d9cd;
      --accent:#963841;
      --accent-2:#d7ae57;
      --accent-soft:#f3e7e7;
      --shadow:0 10px 35px rgba(65,32,24,.08);
      --nav:#f7f0e5;
      --success:#4b7f56;
      --danger:#a23b3b;
      --shelf:#6d4b3c;
      --radius:24px;
      --hero-grad:linear-gradient(145deg,#8f2f39 0%,#6d1e28 100%);
      --library-bg:radial-gradient(circle at top,#2d3461 0%, #151a36 64%, #101528 100%);
      --font-body:"Inter",system-ui,sans-serif;
      --font-title:"Playfair Display",Georgia,serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:98px;position:relative}
    .topbar{padding:20px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;gap:12px;align-items:center}
    .brand-badge{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,#c7a15e,#a26d35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px;box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.7)}
    .eyebrow{font-size:14px;color:var(--muted);font-style:italic}
    h1,h2,h3,h4{font-family:var(--font-title);margin:0;color:#2d2220}
    h1{font-size:40px;line-height:1}
    h2{font-size:22px;margin-bottom:12px}
    h3{font-size:20px;margin-bottom:8px}
    p{margin:0 0 8px}
    .page{padding:0 16px 24px}
    .section-gap{display:grid;gap:16px}
    .card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px}
    .hero{background:var(--hero-grad);color:#fff;overflow:hidden;position:relative}
    .hero h3,.hero h2,.hero p,.hero .eyebrow{color:#fff}
    .hero .eyebrow{opacity:.8}
    .hero .hero-book{position:absolute;left:18px;top:18px;width:94px;height:130px;border:2px dashed rgba(255,255,255,.35);border-radius:18px;display:grid;place-items:center;opacity:.9;overflow:hidden;background:rgba(255,255,255,.05)}
    .hero .hero-book img{width:100%;height:100%;object-fit:cover}
    .hero-copy{padding-left:112px;min-height:136px;display:grid;align-content:start;gap:8px}
    .hero-actions{display:grid;gap:10px;margin-top:16px}
    .btn,.btn-ghost,.btn-soft,.chip,.mini-btn{border:none;border-radius:999px;padding:13px 16px;font-weight:600}
    .btn{background:#f7f0e5;color:#5a2629}
    .btn-ghost{background:transparent;color:inherit;border:1.5px solid rgba(255,255,255,.28)}
    .btn-soft{background:var(--accent);color:#fff}
    .mini-btn{padding:8px 12px;background:var(--accent-soft);color:var(--accent);font-size:13px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .muted{color:var(--muted)}
    .small{font-size:13px}
    .tiny{font-size:12px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--accent-soft);font-size:13px;color:var(--accent);font-weight:600}
    .banner{padding:14px 18px;border-radius:18px;background:#d8be91;color:#412b21;border:1px solid #caa96e;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow)}
    .banner strong{font-family:var(--font-title);font-size:20px}
    .shelf-shell{background:var(--card);padding:10px;border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line)}
    .shelf-preview{background:var(--library-bg);border-radius:24px;overflow:hidden;padding:14px;color:#fff;min-height:230px}
    .shelf-row{height:164px;display:flex;gap:4px;align-items:flex-end;padding:0 4px 10px;border-bottom:10px solid rgba(178,140,91,.95);box-shadow:0 10px 16px rgba(0,0,0,.35);overflow-x:auto}
    .shelf-row + .shelf-row{margin-top:22px}
    .shelf-book{flex:0 0 auto;border:none;border-radius:4px 4px 2px 2px;box-shadow:3px 2px 8px rgba(0,0,0,.35);overflow:hidden;position:relative;padding:0;background:#7d5d89;color:#fff}
    .shelf-book img{width:100%;height:100%;object-fit:fill;display:block}
    .shelf-book span{writing-mode:vertical-rl;font-size:12px;font-family:var(--font-title);padding:4px;display:block;overflow:hidden;text-overflow:ellipsis;max-height:100%}
    .stack-book{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;background:transparent!important;box-shadow:none;border:none;padding:0;overflow:visible}
    .stack-layer{height:18px;border-radius:6px 10px 10px 6px;box-shadow:3px 2px 8px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden;background:var(--stack-color,#7b5d7b)}
    .stack-layer img{width:100%;height:100%;object-fit:cover;display:block}
    .stack-label{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:10px;font-family:var(--font-title);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
    .book-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .book-card{background:transparent;border:none;text-align:left;padding:0;color:inherit}
    .book-cover{height:190px;border-radius:18px;background:#ddd0bf;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.05);display:grid;place-items:center;text-align:center;padding:10px}
    .book-cover img{width:100%;height:100%;object-fit:cover;display:block}
    .book-title{font-weight:700;font-size:17px;line-height:1.15;margin:10px 0 3px}
    .tabs{display:flex;gap:10px;overflow:auto;padding-bottom:4px}
    .chip{background:#f0e7dd;color:#6f625c;white-space:nowrap}
    .chip.active{background:#48372b;color:#fff}
    .fab{position:fixed;right:calc(50% - 220px);bottom:110px;width:62px;height:62px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:34px;box-shadow:0 12px 24px rgba(150,56,65,.3)}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line);z-index:40}
    .nav button{border:none;background:transparent;padding:8px 0 4px;color:#6e5b53;border-radius:18px;display:grid;justify-items:center;gap:4px;font-size:12px}
    .nav button span:first-child{font-size:20px;line-height:1}
    .nav button.active{background:#eadfcf;color:var(--accent);font-weight:700}
    .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .metric{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px}
    .metric .n{font-size:34px;font-family:var(--font-title)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
    .day{aspect-ratio:1;border-radius:14px;background:#f1ece3;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:#8b7c72;overflow:hidden}
    .day.read{border:2px solid #834147;background:#fff}
    .list{display:grid;gap:12px}
    .list-item{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
    .thumb{width:52px;height:74px;border-radius:10px;background:#dfd1c0;overflow:hidden;flex-shrink:0;display:grid;place-items:center}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .field{display:grid;gap:6px}
    label{font-size:13px;color:#6e5c57;font-weight:600}
    input,select,textarea{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink)}
    textarea{min-height:90px;resize:vertical}
    dialog{width:min(96vw,460px);border:none;padding:0;background:transparent}
    dialog::backdrop{background:rgba(34,18,19,.55);backdrop-filter:blur(2px)}
    .sheet{background:var(--card);border-radius:28px 28px 18px 18px;box-shadow:0 25px 60px rgba(20,10,10,.25);max-height:88vh;overflow:auto;padding:18px;border:1px solid var(--line)}
    .sheet-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
    .sheet-close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#725f57;font-size:24px;line-height:1}
    .search-results{display:grid;gap:12px;margin-top:14px}
    .search-card{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);background:#fff;border-radius:20px}
    .search-card .thumb{width:62px;height:92px}
    .search-card button{margin-top:8px}
    .segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#efe5da;padding:6px;border-radius:999px}
    .segmented button{border:none;border-radius:999px;background:transparent;padding:10px 12px;font-weight:600;color:#6f625c}
    .segmented button.active{background:#fff;color:var(--accent);box-shadow:0 4px 10px rgba(0,0,0,.06)}
    .preview{height:280px;background:radial-gradient(circle at top,#48558e 0%,#1f2747 55%,#141b34 100%);border-radius:20px;display:grid;place-items:center;perspective:1100px;overflow:hidden;touch-action:none}
    .cube{position:relative;transform-style:preserve-3d;transition:transform .16s ease}
    .face{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;backface-visibility:hidden;background:#7e5974;color:#fff;border:1px solid rgba(255,255,255,.28);font-family:var(--font-title)}
    .face img{width:100%;height:100%;object-fit:fill}
    .face.spine span{writing-mode:vertical-rl;padding:4px}
    .swatch-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .notice{padding:12px 14px;border-radius:16px;background:#fff0e8;color:#79422b;border:1px solid #edc7b2;font-size:13px}
    .success{background:#e8f5eb;color:#2d6640;border:1px solid #b6dec0}
    .editor-shell{display:grid;gap:14px}
    .editor-hero{padding:14px;border-radius:24px;background:linear-gradient(180deg,#fffaf3 0%,#f6eee3 100%);border:1px solid var(--line);box-shadow:var(--shadow)}
    .editor-hero .preview{height:290px}
    .editor-view-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
    .editor-view-tabs button{border:none;border-radius:14px;padding:10px 8px;background:#efe5da;color:#6f625c;font-weight:700;font-size:12px}
    .editor-jump{display:flex;gap:8px;overflow:auto;padding-top:12px}
    .editor-jump button{border:none;border-radius:999px;padding:10px 12px;background:#fff;color:var(--accent);font-weight:700;white-space:nowrap;border:1px solid var(--line)}
    .editor-block{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
    .editor-block h3{font-size:18px;margin-bottom:4px}
    .editor-block .muted.small{margin-bottom:10px;display:block}
    .editor-actionbar{position:sticky;bottom:-18px;background:linear-gradient(180deg,rgba(251,247,240,0),#fbf7f0 28%);padding-top:18px}
    .editor-save-row{display:flex;gap:10px;flex-wrap:wrap}
    .editor-save-row .btn-soft{flex:1 1 180px}
    .editor-statline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .editor-stat{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:#6f625c}

    .empty{padding:20px;border:1px dashed #d8c8b6;border-radius:20px;text-align:center;color:#8b7d74}
    .switch-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #efe3d7}
    .switch-row:last-child{border-bottom:none}
    .link-btn{padding:0;background:none;border:none;color:var(--accent);font-weight:700}
    @media (max-width:520px){.fab{right:18px}.book-grid{grid-template-columns:1fr 1fr}.metric-grid{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}.hero-copy{padding-left:102px}}
  
/* Responsive containment: allow grid tracks and flex children to shrink. */
html,body{max-width:100%;overflow-x:hidden} .app{width:100%;max-width:480px;overflow-x:clip} .page,.section-gap,.section-gap>*,.card,.hero-copy,.shelf-shell,.shelf-preview,.grid-2>*{min-width:0;max-width:100%} .section-gap{grid-template-columns:minmax(0,1fr)} .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))} .hero-actions{grid-template-columns:minmax(0,1fr)} .hero-actions button{width:100%;white-space:normal} .brand{min-width:0} .brand-badge{flex-shrink:0} .brand h1{font-size:clamp(23px,6vw,32px);line-height:1.08;overflow-wrap:anywhere} .topbar>.mini-btn{flex-shrink:0;max-width:110px} .tabs,.shelf-row{min-width:0;max-width:100%;overflow-x:auto} .banner{min-width:0} .banner>div{min-width:0} .banner button{flex-shrink:0} .nav{width:min(480px,100%);grid-template-columns:repeat(5,minmax(0,1fr));padding-inline:5px} .nav button{min-width:0;font-size:clamp(9px,2.65vw,12px)} .fab{z-index:35} .sheet{max-width:100%} h1,h2,h3,h4{color:var(--ink)} .hero h2,.hero h3{color:#fff} .book-cover{padding:0} .book-cover img{object-fit:contain} @media(max-width:520px){.grid-2{grid-template-columns:minmax(0,1fr)} .topbar{padding:16px 16px 12px}.hero-copy{padding-left:100px}.hero .hero-book{width:78px;height:116px}.hero-copy h2{font-size:21px}.hero-copy p{font-size:14px;line-height:1.4}.hero-copy{min-height:122px}.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:10px}.metric .n{font-size:25px}}

/* v0.5.1: mobile editor containment and stable controls */
#dlg{box-sizing:border-box;width:calc(100% - 20px);max-width:460px;max-height:calc(100dvh - 20px);margin:auto;overflow:hidden}
#dlg .sheet{width:100%;max-width:100%;min-width:0;max-height:calc(100dvh - 20px);overflow-y:auto;overflow-x:hidden;padding:14px;overscroll-behavior:contain}
#dlg .editor-shell,#dlg .editor-shell>*,#dlg .editor-hero,#dlg .editor-block,#dlg .field,#dlg .swatch-row,#dlg .swatch-row>*{min-width:0;width:100%;max-width:100%}
#dlg .editor-shell{grid-template-columns:minmax(0,1fr)}
#dlg .editor-hero{padding:10px}
#dlg .editor-hero .preview{width:100%;min-width:0;height:clamp(210px,36dvh,290px)}
#dlg .editor-view-tabs,#dlg .editor-jump{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible}
#dlg .editor-view-tabs button,#dlg .editor-jump button{min-width:0;width:100%;white-space:normal;overflow-wrap:anywhere;font-size:12px;padding:11px 5px}
#dlg .editor-statline{width:100%;gap:6px}
#dlg .editor-stat{max-width:100%;white-space:normal;overflow-wrap:anywhere;font-size:11px;padding:7px 9px}
#dlg .swatch-row{grid-template-columns:repeat(2,minmax(0,1fr))}
#dlg input,#dlg select,#dlg textarea{min-width:0;max-width:100%;width:100%}
#dlg .sheet-header>div{min-width:0;overflow-wrap:anywhere}
#dlg .sheet-close{flex:none}
#dlg .editor-actionbar{bottom:-14px;z-index:3;padding-bottom:8px}
#dlg .editor-save-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
#dlg .editor-save-row button{min-width:0;max-width:100%;white-space:normal}
#dlg .editor-block{scroll-margin-top:10px}
@media(max-width:350px){#dlg .swatch-row{grid-template-columns:minmax(0,1fr)}#dlg .sheet{padding:10px}#dlg .editor-save-row{grid-template-columns:minmax(0,1fr)}}


/* Mobile shell and theme-aware surfaces */
:root{--chip-bg:#ece3d7;--chip-ink:#594b42;--selected-bg:#49382c;--selected-ink:#fff;--nav-active:#eadfcf;--nav-ink:#65554c;--field-bg:#fffaf3;--field-ink:var(--ink)}
html{background:var(--bg);color-scheme:light}
body{min-height:100vh;min-height:100dvh;background:var(--bg);margin:0}
.app{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));overflow-x:clip}
.nav{bottom:0;padding:9px max(5px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(5px,env(safe-area-inset-left,0px));background:var(--bg);color:var(--nav-ink);box-shadow:0 -1px 0 var(--line);border-top:0}
.nav button{color:var(--nav-ink);gap:5px;min-height:58px;font-size:clamp(10px,2.7vw,12px);padding:6px 1px;line-height:1.2}
.nav button.active{background:var(--nav-active);color:var(--accent)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px}
.status-filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:12px 0;overflow:visible;width:100%;padding:0}
.status-filters .chip{grid-column:span 2;min-width:0;white-space:normal;padding:11px 5px;font-size:13px;line-height:1.15;text-align:center;min-height:42px;border:1px solid var(--line);background:var(--chip-bg);color:var(--chip-ink)}
.status-filters .chip:nth-child(4),.status-filters .chip:nth-child(5){grid-column:span 3}
.status-filters .chip.active{background:var(--selected-bg);color:var(--selected-ink);border-color:var(--selected-bg)}
.chip{background:var(--chip-bg);color:var(--chip-ink)}.chip.active{background:var(--selected-bg);color:var(--selected-ink)}
input,select,textarea{background:var(--field-bg);color:var(--field-ink);min-width:0;max-width:100%;font-size:16px}input::placeholder,textarea::placeholder{color:var(--muted)}
.book-search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0}.book-search svg{flex:none;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8}.book-search input{background:transparent;border:0;padding:8px 0;outline:none;width:100%}.book-search:focus-within{outline:2px solid var(--accent)}
.book-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.book-card{min-width:0;overflow-wrap:anywhere}.book-cover{height:auto;aspect-ratio:2/3;max-height:260px}.book-cover img{object-fit:contain}.label-row>div{min-width:0}.label-row>button{flex-shrink:0}.topbar{padding-top:16px}.editor-block{background:var(--card)}.editor-stat{background:var(--panel);color:var(--ink)}
html[data-theme="dark"],html[data-theme="celestial"]{color-scheme:dark;--chip-bg:var(--panel);--chip-ink:var(--ink);--selected-bg:#c5a0db;--selected-ink:#211831;--nav-active:var(--accent-soft);--nav-ink:var(--muted);--field-bg:var(--panel)}
@media(max-width:360px){.status-filters .chip{font-size:12px}.nav button{font-size:9px}.topbar>.mini-btn{padding:8px 10px}.brand-badge{width:46px;height:46px}.brand h1{font-size:23px}}

/* v0.6 — tipografía, contraste en temas oscuros, portada de lectura y detalles */
:root{--font-body:"Figtree",system-ui,sans-serif;--font-title:"Cormorant Garamond",Georgia,serif;--surface:#fff}
html[data-theme="dark"],html[data-theme="celestial"]{--surface:var(--panel)}
h1{font-size:clamp(30px,8.5vw,38px)!important;font-weight:700;letter-spacing:-.01em}
h2{font-size:27px;font-weight:700}h3{font-size:23px;font-weight:700}
.book-title{font-family:var(--font-title);font-size:19px;font-weight:700}
.eyebrow{font-style:normal;font-weight:500;letter-spacing:.01em}
.sheet-close,.search-card,.editor-jump button,.segmented button.active,.editor-block{background:var(--surface)}
.segmented{background:var(--chip-bg)}
.segmented button{color:var(--chip-ink)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.hero{border:1px solid rgba(215,174,87,.55);box-shadow:var(--shadow),inset 0 0 0 4px rgba(215,174,87,.08)}
.hero .hero-book{width:100px;height:146px;border:0;border-radius:6px 10px 10px 6px;box-shadow:6px 8px 18px rgba(0,0,0,.45),inset 3px 0 0 rgba(255,255,255,.18);font-size:34px}
.hero-copy{padding-left:120px;min-height:146px}
.hero h2{font-size:28px;line-height:1.05}
.bar{height:6px;border-radius:9px;background:rgba(127,127,127,.28);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--accent-2)}
.book-cover{border-radius:10px 14px 14px 10px;box-shadow:5px 7px 16px rgba(40,20,15,.22)}
.book-card:active .book-cover{transform:scale(.98)}
.book-search .sort{width:auto;flex:none;border:0;background:transparent;padding:8px 2px;color:var(--muted);font-size:13px;font-weight:600}
.nav button.active{box-shadow:inset 0 2px 0 var(--accent-2)}
.shelf-row{border-bottom-color:#a77a4a}
dialog{animation:sheetIn .22s ease-out}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--selected-bg);color:var(--selected-ink);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.book-grid{align-items:start}.book-card{align-self:start;display:block}.page{padding-bottom:84px}
@media(prefers-reduced-motion:reduce){dialog{animation:none}#toast{transition:none}}

</style>
</head>
<body>
<div class="app" id="app">
  <div id="topbar"></div>
  <main class="page" id="main"></main>
  <button class="fab" title="Añadir libro" onclick="openAddBookFlow()">＋</button>
  <nav class="nav" id="nav"></nav>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="importer" hidden accept=".csv,.json">
<script src="app.js?v=6.0"></script>
</body>
</html>
